<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes &mdash; Python for AI/ML</title>
  <meta name="description" content="A study grimoire for Python, NumPy, Pandas, Matplotlib and Scikit-Learn." />

  <!-- Google Fonts: serif display for headings, Inter for body, JetBrains Mono for code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Ambient background layer: soft drifting glows, purely decorative -->
  <div class="ambient-glow" aria-hidden="true"></div>

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="brand-sigil" aria-hidden="true">&#10022;</span>
      <div class="brand-text">
        <p class="brand-title">Notes</p>
        <p class="brand-subtitle">Python for AI / ML</p>
      </div>
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Collapse sidebar" aria-expanded="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
    </div>

    <nav class="sidebar-nav" aria-label="Section navigation">
      <p class="nav-label">Table of Contents</p>
      <ul id="navList" class="nav-list"><!-- populated by app.js --></ul>
    </nav>

    <div class="sidebar-footer">
      <p>&#10022; Crafted for late-night study spells &#10022;</p>
    </div>
  </aside>

  <!-- Backdrop for mobile sidebar overlay -->
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- ============ MAIN CONTENT ============ -->
  <div class="main-wrap">

    <!-- Sticky top bar: search + mobile menu button -->
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Open sidebar" aria-controls="sidebar" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>

      <div class="search-wrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search spells, topics, or code..." aria-label="Search notes" autocomplete="off" />
        <span class="search-hint" id="searchHint"></span>
      </div>

      <span class="topbar-glyph" aria-hidden="true">&#10038;</span>
    </header>

    <!-- No-results state, hidden by default -->
    <div class="empty-state" id="emptyState" hidden>
      <span aria-hidden="true">&#10023;</span>
      <p>No notes match &ldquo;<span id="emptyQuery"></span>&rdquo;.</p>
      <p class="empty-sub">Try a different keyword — or clear the search to see everything again.</p>
    </div>

    <!-- Notes render here, injected by app.js from notes-data.js -->
    <main class="notes-content" id="notesContent" aria-live="polite"></main>

  </div>

  <!-- ============ CONSTELLATION PROGRESS RAIL ============ -->
  <!-- Signature element: a vertical line of star-nodes, one per section,
       that fill in as the reader scrolls past that section. -->
  <nav class="progress-rail" id="progressRail" aria-label="Reading progress">
    <div class="rail-track">
      <div class="rail-fill" id="railFill"></div>
    </div>
    <ul class="rail-nodes" id="railNodes"><!-- populated by app.js --></ul>
  </nav>

  <!-- Back-to-top control -->
  <button class="to-top-btn" id="toTopBtn" aria-label="Back to top">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
  </button>

  <!-- Toast notification for "copied" feedback -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="notes-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
